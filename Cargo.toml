[package]
# Published as `crush-squeeze`: the crates.io name `squeeze` is an unrelated
# compression library (jamolnng, 2020). The binary is still `squeeze`.
name = "crush-squeeze"
description = "Intuitive one-command build tool for the Crush ecosystem — wraps crush-pkg's check/build/run pipeline"
version = "0.1.0"
edition = "2024"
# edition = "2024" stabilised in 1.85.0; pin the contract for downstream callers.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nixpt/squeeze"
repository = "https://github.com/nixpt/squeeze"
readme = "README.md"
keywords = ["crush", "build-tool", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]
# Don't ship agent-memory / planning board in the published tarball.
exclude = [".dejavue/**", ".jagent/**"]

[[bin]]
name = "squeeze"
path = "src/main.rs"

[dependencies]
# crush-pkg is consumed from crates.io (crush-ast 0.8.x line). crush-vm was a
# dead dependency (SQUEEZE-7) and has been removed; crush-pkg pulls it in
# transitively. For local crush-ast sources use a gitignored
# `.cargo/config.toml` `[patch.crates-io]` override, not a committed path-dep.
crush-pkg = "0.8.0"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
