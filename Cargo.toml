[package]
# Published as `crush-squeeze`: the crates.io name `squeeze` is an unrelated
# compression library (jamolnng, 2020). The binary is still `squeeze`.
name = "crush-squeeze"
description = "Crush's cargo: create, build, run and test Crush programs (front door over crush-pkg)"
version = "0.1.0"
edition = "2024"
# edition = "2024" stabilised in 1.85.0; pin the contract for downstream callers.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nixpt/squeeze"
repository = "https://github.com/nixpt/squeeze"
readme = "README.md"
keywords = ["crush", "build-tool", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]
# Don't ship agent-memory / planning board in the published tarball.
exclude = [".dejavue/**", ".jagent/**"]

[[bin]]
name = "squeeze"
path = "src/main.rs"

[dependencies]
# squeeze is the front door; crush-pkg (crush-ast) is the engine. Both come
# from crates.io. SQUEEZE-8 needs the crush-pkg API from crush-ast CRUSH-367
# (import mode, build_file, quiet, write_output_to, scaffold_lib_package),
# which is NOT in crush-pkg 0.9.0: release builds need the next crush-ast
# release, and these two requirements bumped to it. Until then develop with a
# gitignored `.cargo/config.toml` `[patch.crates-io]` pointing at a local
# crush-ast checkout (README "Developing against local crush-ast").
crush-pkg = "0.9.0"
# HostCapsBuilder: the run's capabilities and `sys.args()`.
crush-lang-sdk = "0.9.0"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
