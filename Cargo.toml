[package]
name = "squeeze"
description = "Intuitive one-command build tool for the Crush ecosystem — wraps crush-pkg's check/build/run pipeline"
version = "0.1.0"
edition = "2024"
# edition = "2024" stabilised in 1.85.0; pin the contract for downstream callers.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nixpt/squeeze"
repository = "https://github.com/nixpt/squeeze"
readme = "README.md"
keywords = ["crush", "build-tool", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]
# Don't ship agent-memory / planning board in the published tarball.
exclude = [".dejavue/**", ".jagent/**"]

[[bin]]
name = "squeeze"
path = "src/main.rs"

[dependencies]
# Peer path-dep, flat projects/ layout — same pattern buckets/crush-web use
# to reach into crush-ast. Kept alongside `version =` (not registry-only):
# `path` + `version` together means local builds resolve via the path
# (crush-workspace/CLAUDE.md: don't switch this repo to a registry-only dep
# until crush-pkg/crush-vm actually publish — doing so broke `cargo check`
# here for no local benefit), while `cargo publish` still requires and
# verifies the registry version, so the upstream-gate blocker documented in
# RELEASE.md is unchanged: `cargo publish --dry-run` still fails until
# crush-pkg v0.3.0 / crush-vm v0.3.0 land on crates.io.
crush-pkg = { path = "../../crush-ast/crates/crush-pkg", version = "0.3.0" }
crush-vm = { path = "../../crush-ast/crates/crush-vm", version = "0.3.0", default-features = false }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
